<html lang="en">
<head>

    <title>Document</title>
    <script>
        function sum()
        {
            let age=parseInt(prompt("Enter value of a:"));
            if(age>=18)
            {
                let c=confirm("do you want to submit your response");
                if(c){
                    alert("your response is submitted");
                }
                else{
                    alert("thankyou!");
                }
                
                alert("You are eligible for voting");
            }
            else{
                alert("You are not eligible for voting");
            }
        }
    
    </script>
</head>
<body>
    <input type="button" onclick="sum()" value="Check Eligibility">
</body>
